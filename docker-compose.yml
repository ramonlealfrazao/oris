services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oris_db
      MYSQL_USER: oris_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-oris-demo-troque}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-demo-troque}
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - oris_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: oris_db
      DB_USER: oris_user
      DB_PASSWORD: ${DB_PASSWORD:-oris-demo-troque}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ORIS_SEED: ${ORIS_SEED:-true}
    ports:
      - "127.0.0.1:${ORIS_PORT:-5000}:5000"

volumes:
  oris_db_data:
