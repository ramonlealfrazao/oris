# ORIS na AWS (EC2): Caddy (HTTPS) + app + MySQL 8. Autonomo (nao usa o docker-compose.yml).
# Subir:  sudo docker compose -f docker-compose.aws.yml --env-file .env.aws up -d --build
# Exige um arquivo .env.aws (ver docs/AWS_DEPLOY.md). Sem valores padrao inseguros: faltou variavel, nao sobe.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oris_db
      MYSQL_USER: oris_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - oris_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: oris_db
      DB_USER: oris_user
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXY_COUNT: "1"
      ORIS_SEED: ${ORIS_SEED:-true}
      ORIS_DEMO_SENHA: ${ORIS_DEMO_SENHA:?defina ORIS_DEMO_SENHA}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    # Sem "ports": so o Caddy fala com a app, dentro da rede do Docker.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ORIS_DOMAIN: ${ORIS_DOMAIN:?defina ORIS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  oris_db_data:
  caddy_data:
  caddy_config:
